name: Destruir Infraestructura (Terraform)
on:
  workflow_dispatch:
jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
      - env:
          TF_VAR_public_key: ${{ secrets.EC2_PUBLIC_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_github_repo_url: "https://github.com/${{ github.repository }}.git"
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: terraform destroy -auto-approve
